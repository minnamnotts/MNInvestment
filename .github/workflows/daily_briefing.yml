name: Daily Investment Briefing

on:
  schedule:
    # 매크로 뉴스봇: 매일 07:00 SGT = 23:00 UTC (전날)
    - cron: '0 23 * * *'
    # 유튜브 서머리 (채널): 월~토 08:40 SGT = 00:40 UTC
    - cron: '40 0 * * 1-6'
    # 유튜브 for Jiha (개인): 매일 08:00 SGT = 00:00 UTC
    - cron: '0 0 * * *'

  # 수동 실행 버튼 (테스트용)
  workflow_dispatch:
    inputs:
      run_macro:
        description: '매크로 뉴스봇 실행'
        type: boolean
        default: false
      run_youtube:
        description: '유튜브 서머리 (채널) 실행'
        type: boolean
        default: false
      run_jiha:
        description: '유튜브 for Jiha (개인) 실행'
        type: boolean
        default: false

jobs:
  # ─────────────────────────────────────────────
  # 1) 매크로 뉴스봇 → MN Investment 채널
  #    매일 07:00 SGT
  # ─────────────────────────────────────────────
  macro_news:
    name: 매크로 뉴스 브리핑
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_macro == 'true') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 23 * * *')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install anthropic requests feedparser python-dotenv

      - name: 실행
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          echo "CHAT_ID 길이: ${#TELEGRAM_CHAT_ID}"
          echo "TOKEN 길이: ${#TELEGRAM_BOT_TOKEN}"
          python macro_news_bot.py

  # ─────────────────────────────────────────────
  # 2) 유튜브 서머리 → MN Investment 채널
  #    월~토 08:40 SGT
  # ─────────────────────────────────────────────
  youtube_channel:
    name: 유튜브 서머리 (채널)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_youtube == 'true') ||
      (github.event_name == 'schedule' && github.event.schedule == '40 0 * * 1-6')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install anthropic requests youtube-transcript-api python-dotenv

      - name: 실행
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY:     ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python youtube_summary_bot.py

  # ─────────────────────────────────────────────
  # 3) 유튜브 for Jiha → MNI for Jiha 채널
  #    매일 08:40 SGT
  # ─────────────────────────────────────────────
  youtube_jiha:
    name: 유튜브 for Jiha
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_jiha == 'true') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install anthropic requests youtube-transcript-api python-dotenv yt-dlp openai-whisper

      - name: 실행
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_JIHA_ID }}
        run: python "YouTube for Jiha.py"
